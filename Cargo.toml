[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/OverbearingPearl/pearl"
authors = ["OverbearingPearl"]

[workspace.dependencies]
pearl-core = { path = "crates/pearl-core", version = "0.1.0" }
pearl-session = { path = "crates/pearl-session", version = "0.1.0" }
pearl-provider = { path = "crates/pearl-provider", version = "0.1.0" }
pearl-tools = { path = "crates/pearl-tools", version = "0.1.0" }
pearl-agent = { path = "crates/pearl-agent", version = "0.1.0" }
pearl-text = { path = "crates/pearl-text", version = "0.1.0" }
pearl-emacs = { path = "crates/pearl-emacs", version = "0.1.0" }
pearl-vim = { path = "crates/pearl-vim", version = "0.1.0" }
pearl-tui = { path = "crates/pearl-tui", version = "0.1.0" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures = "0.3"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
rstest = "0.26"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true