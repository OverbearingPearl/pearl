[package]
name = "ci-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The parsing half of the ci-rust check suite: config, file classification, and the structural checks."
publish = false

# Standalone: ci-tools is vendored into a consumer's ci/ and must not be
# absorbed into the consumer's workspace. An empty workspace table makes this
# manifest its own workspace root.
[workspace]

[[bin]]
name = "ci-tools"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
cargo_metadata = "0.19"

[profile.release]
opt-level = 2