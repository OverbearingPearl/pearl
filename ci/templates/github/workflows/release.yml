name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: release-check
        shell: bash
        run: make release-check
      - name: dist
        shell: bash
        run: make dist
      - name: publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
