# Default policy for the ci-rust suite. A consumer overrides any of this in
# its own config/ci.toml (project-owned, never replaced by bootstrap); the
# project file is deep-merged over this one and wins on every key it sets.
#
# Everything here is generic: no project name appears in the suite. The
# project-neutral check enforces that.

msrv = "1.85"
edition = "2024"
src-dir = "crates"
test-dir = "tests"
tooling-dir = "ci"
vendor-dir = "vendor"
comment-width = 80
crate-prefix = ""
main-crate = ""

# Layer order: a crate may depend on its own layer and the ones before it.
# Empty disables the layer-order check. A consumer that wants layers lists
# them bottom-up and assigns crates to each.
[layers]
order = []

# Class profiles. A class says what a file is; the profile says what rules
# reach it. `may-require` is the set of classes a crate of this class may
# depend on. vendor is exempt from style and may only depend on vendor.
[profiles.main]
headers-require = ["package"]
headers-forbid = []
may-require = ["business"]
commentary-min = 2
commentary-max = 0

[profiles.business]
headers-require = ["module"]
headers-forbid = ["package"]
may-require = ["business"]
commentary-min = 2
commentary-max = 0

[profiles.test]
headers-require = []
headers-forbid = ["package"]
may-require = ["main", "business", "test", "vendor"]
commentary-min = 1
commentary-max = 3

[profiles.tooling]
headers-require = []
headers-forbid = ["package"]
may-require = ["tooling"]
commentary-min = 1
commentary-max = 0

[profiles.vendor]
headers-require = []
headers-forbid = []
may-require = ["vendor"]
commentary-min = 0
commentary-max = 0

# Banned constructs: a regex and the suggestion shown when it matches.
# Empty by default; a consumer adds its own (e.g. dbg!, or unwrap in business
# code). The vendor class is exempt.
# [[banned]]
# pattern = "\\bdbg!\\s*\\("
# suggestion = "remove the dbg! macro before committing"

[size]
directories = ["crates"]
window = 4
large = 300
shown = 20
skip = ["^//", "^/\\*", "^\\*", "^use ", "^#\\["]

[coverage]
directories = ["crates"]

# Performance budgets, read by `make perf-check` (the nightly gate). Empty by
# default; a consumer names a bench and gives it a max (and optional min).
# [perf.queue-dispatch]
# max = 5000.0