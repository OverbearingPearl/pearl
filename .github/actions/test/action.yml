name: test
description: Run the ERT test suite, skipping cleanly when there are no tests.

runs:
  using: composite
  steps:
    - name: install emacs
      shell: bash
      run: |
        if ! command -v emacs >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y emacs
        fi
        emacs --version | head -1

    - name: probe for test files
      id: probe
      shell: bash
      run: |
        shopt -s nullglob
        testdir=$(ci/config-export.sh test-dir)
        files=("$testdir"/*.el)
        if [ "${#files[@]}" -eq 0 ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::notice::no test files found; skipping ERT"
        else
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi

    - name: test
      if: steps.probe.outputs.found == 'true'
      shell: bash
      run: |
        mkdir -p build
        set -o pipefail
        make test 2>&1 | tee -a build/test.log
