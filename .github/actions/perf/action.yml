name: perf
description: Measure the hot paths; report mode never fails, gate mode does.
inputs:
  report:
    description: "'true' to print the table without gating on budgets"
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
    - name: perf
      shell: bash
      run: |
        mkdir -p build
        set -o pipefail
        if [ "${{ inputs.report }}" = "true" ]; then
          make perf 2>&1 | tee -a build/perf.log
        else
          make perf-check 2>&1 | tee -a build/perf.log
        fi
