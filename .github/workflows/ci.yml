name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
    inputs:
      melpazoid:
        description: >-
          Also run melpazoid. Takes about half an hour: it builds a container
          whose base compiles Emacs from source.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/lint
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          stage: lint
          repository: ${{ github.repository }}
          ref-name: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          smtp-host: ${{ secrets.SMTP_HOST }}
          smtp-port: ${{ secrets.SMTP_PORT }}
          smtp-user: ${{ secrets.SMTP_USER }}
          smtp-pass: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.NOTIFY_EMAIL }}

  # Runs on the Emacs shipped by ubuntu-latest. The configured minimum
  # in ci/config.el is enforced by the emacs-version-minimum check, so a
  # runner that is too old fails with a precise message instead of
  # silently testing a different version than the package claims.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          stage: test
          repository: ${{ github.repository }}
          ref-name: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          smtp-host: ${{ secrets.SMTP_HOST }}
          smtp-port: ${{ secrets.SMTP_PORT }}
          smtp-user: ${{ secrets.SMTP_USER }}
          smtp-pass: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.NOTIFY_EMAIL }}

  # Manual only, and the reason is the shape of melpazoid's cost.  It builds
  # a container whose base compiles Emacs from source (tens of minutes), then
  # runs checkdoc, package-lint and byte-compile inside it -- the same three
  # checks `make lint` already runs on the runner's Emacs.  What it adds on
  # top is MELPA's own checklist and recipe build, which is worth reading
  # once before a MELPA pull request or a release, not on every push.  The
  # job used to be blocking on every event; it never finished, because any
  # push inside the compile cancels it.
  melpazoid:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.melpazoid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/melpazoid
        with:
          repository: ${{ github.repository }}
      - if: failure()
        uses: ./.github/actions/notify-failure
        with:
          stage: melpazoid
          repository: ${{ github.repository }}
          ref-name: ${{ github.ref_name }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          smtp-host: ${{ secrets.SMTP_HOST }}
          smtp-port: ${{ secrets.SMTP_PORT }}
          smtp-user: ${{ secrets.SMTP_USER }}
          smtp-pass: ${{ secrets.SMTP_PASS }}
          to: ${{ secrets.NOTIFY_EMAIL }}
