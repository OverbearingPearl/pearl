name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One artifact per platform: the native binary built on its own OS, so the
  # Windows sandbox, the macOS Seatbelt path, and the Linux Landlock path are
  # each compiled where they run. The shell steps run under bash on every
  # runner (Git Bash on Windows).
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: release-check
        shell: bash
        run: make release-check
      - name: dist
        shell: bash
        run: make dist
      - name: publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
  # The artifacts above are per-run and expire; a user downloading PEARL has no
  # reason to have a GitHub account. This job collects the three binaries and
  # attaches them to the release the tag already created, named for the platform
  # each was built on, so the releases page is what a user lands on.
  release:
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: collect
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mkdir -p out
          for dir in artifacts/dist-*; do
            target="${dir#artifacts/dist-}"
            if [ -f "$dir/pearl.exe" ]; then
              cp "$dir/pearl.exe" "out/pearl-$tag-$target.exe"
            else
              cp "$dir/pearl" "out/pearl-$tag-$target"
            fi
          done
          ls -l out
          gh release create "$tag" --title "$tag" --generate-notes || true
          gh release upload "$tag" out/* --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
