name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One artifact per platform: the native binary built on its own OS, so the
  # Windows sandbox, the macOS Seatbelt path, and the Linux Landlock path are
  # each compiled where they run. The shell steps run under bash on every
  # runner (Git Bash on Windows).
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: release-check
        shell: bash
        run: make release-check
      - name: dist
        shell: bash
        run: make dist
      - name: publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  # The artifacts above are per-run and expire; someone downloading a release
  # has no reason to have a GitHub account. This collects them and attaches
  # each file to the release the tag already created, named for the target it
  # was built for. Nothing here names a project: whatever dist/ produced is
  # what gets attached, so a binary called anything at all arrives correctly.
  release:
    needs: dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: collect
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mkdir -p out
          for dir in artifacts/dist-*; do
            target="${dir#artifacts/dist-}"
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              if [ "$name" != "${name%.*}" ]; then
                stem="${name%.*}"
                ext=".${name##*.}"
              else
                stem="$name"
                ext=""
              fi
              cp "$file" "out/$stem-$tag-$target$ext"
            done
          done
          gh release upload "$tag" out/* --clobber
