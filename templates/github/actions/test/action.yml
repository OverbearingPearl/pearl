name: test
description: Run the cargo test suite (identical to the pre-push hook).
inputs:
  packages:
    description: Packages this shard owns; empty runs the whole workspace.
    required: false
    default: ''
  parallel:
    description: >-
      Run the stories beside each other with cargo-nextest, one process each.
      A job per member answers the cost of starting a process; this answers
      the cost of a hundred of them in a row, and puts a limit on the one that
      never returns.
    required: false
    default: 'false'
  only:
    description: >-
      A nextest filter expression naming the stories this run executes, for
      measuring one family while a platform is investigated. Empty runs every
      story the shard owns.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
    - if: inputs.parallel == 'true'
      uses: taiki-e/install-action@nextest
    - name: test
      shell: bash
      env:
        CI_TEST_PACKAGES: ${{ inputs.packages }}
        CI_TEST_ONLY: ${{ inputs.only }}
      run: |
        mkdir -p build
        set -o pipefail
        make test 2>&1 | tee -a build/test.log
