# Project policy for the ci-rust check suite.
#
# Written by ci/bootstrap.sh and owned by this repository: the suite in ci/
# is shared and gets replaced, this file does not. It is deep-merged over
# ci/config.toml, so anything set here wins. Delete a key to take the default
# back. Nothing here has to be set to start.

# The Rust floor belongs to the suite, not to this file: a crate that declares
# an older rust-version than the suite runs on fails the check rather than
# lowering the floor.

# Where the suite looks for crates, when the layout is not the default.
# src-dir = "crates"
# test-dir = "tests"
# vendor-dir = "vendor"

# The prefix every business crate name carries, and the crate `make dist' and
# `make release-check' treat as the package's face.
# crate-prefix = "pearl"
# main-crate = "pearl"

# Crate layers, when the architecture has them: a crate may depend on its own
# layer or one before it. Every business crate has to appear in some layer or
# the `layer-order' check reports it, which is the point -- an undeclared crate
# is one nobody placed on purpose. Order is bottom-up.
# [layers]
# order = ["core", "adapters", "product"]
# [layers.members]
# core = ["pearl-queue", "pearl-core"]
# adapters = ["pearl-provider", "pearl-tools", "pearl-sandbox"]
# product = ["pearl-tui", "pearl"]
# [layers.may-require]
# core = ["core"]
# adapters = ["core", "adapters"]
# product = ["core", "adapters", "product"]

# Decision records need no configuration: `adr-format' checks docs/decisions/
# when that directory exists. Vendored code needs none either: `vendor' is a
# class with a profile of its own.

# Banned constructs: a regex and the suggestion shown when it matches. The
# vendor class is exempt.
# [[banned]]
# pattern = "\\bdbg!\\s*\\("
# suggestion = "remove the dbg! macro before committing"

# Performance budgets, read by `make perf-check' (the nightly gate). The name
# is the criterion bench name; max/min are in nanoseconds.
# [perf.queue-dispatch]
# max = 5000.0

# Where `make size' looks, and how long a run of lines has to be before it is
# worth calling copy-paste.
# [size]
# directories = ["crates"]
# window = 4
# large = 300
# shown = 20
# skip = ["^//", "^use ", "^#\\["]

# Coverage instruments the same source set by default.
# [coverage]
# directories = ["crates"]