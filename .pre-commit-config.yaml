# Local hooks only: every hook here runs offline, with no environment to
# build and nothing to download. Anything that needs a package manager
# belongs in CI, not in the gate a developer runs on every commit.
minimum_pre_commit_version: '3.0.0'
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: checks
        name: checks (identical to CI lint)
        entry: make lint
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      # A commit may be rough; a push should be clean.  The test suite is a
      # second today and will not be once it starts real processes, and a gate
      # that gets slow is a gate people learn to skip.
      # The message rules live in prose, in .pi/ai-git-commit.json, and are read
      # by nothing at commit time; this is the mechanical half of them.
      - id: commit-message
        name: commit message shape
        entry: ci/check-commit-message.sh
        language: system
        stages: [commit-msg]

      - id: tests
        name: ERT (identical to CI test)
        entry: make test
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
