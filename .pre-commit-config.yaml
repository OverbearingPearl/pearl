# Local hooks only: every hook here runs offline, with no environment to
# build and nothing to download. Anything that needs a package manager
# belongs in CI, not in the gate a developer runs on every commit.
minimum_pre_commit_version: '3.0.0'
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: checks
        name: checks (identical to CI lint)
        entry: make lint
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
